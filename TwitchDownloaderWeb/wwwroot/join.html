<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join · Clipco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="ui/theme.css">
  <link rel="stylesheet" href="ui/pages.css">
</head>
<body>
  <header class="topbar"><h1>Clipco</h1></header>
  <main class="narrow">
    <section class="panel" id="join-panel"></section>
  </main>
  <script src="reports.js"></script>
  <script type="module">
    import { mountJoinForm } from "./ui/join-form.js";

    // The token is in the fragment (#…), which the browser never sends to the server; it goes in request bodies only
    const token = location.hash.slice(1);
    // Team users' links open the app's start screen since 2026-11-19 (/#join=…); older ones sent as /join.html#… go there too
    const link = await mountJoinForm(document.getElementById("join-panel"), token, {
      onDone: (result) => {
        history.replaceState(null, "", "/join.html"); // drop the token from the address bar and history before leaving
        location.href = result?.staff ? "/admin.html" : "/";
      },
    });
    if (link && link.kind !== "StaffInvite" && link.kind !== "StaffPasswordReset") location.replace(`/#join=${token}`);
  </script>
</body>
</html>
