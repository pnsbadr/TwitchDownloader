<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Library</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1>Clip Library</h1>
    <div class="tz" role="group" aria-label="Show times in">
      <span class="tz-label">Times:</span>
      <button type="button" class="seg" data-tz="local" aria-pressed="true">Local</button>
      <button type="button" class="seg" data-tz="pacific" aria-pressed="false">Pacific</button>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a VOD</h2>

      <!-- Pick a VOD from a channel instead of pasting a link; fills the form below -->
      <div id="browse" class="browse" aria-label="Browse a channel's VODs" role="region">
        <div class="row">
          <label>Saved channels
            <select id="browse-saved">
              <option value="">Choose…</option>
            </select>
          </label>
          <label class="grow">Channel
            <input id="browse-channel" placeholder="Channel name or twitch.tv link" autocomplete="off" spellcheck="false">
          </label>
          <button type="button" id="browse-save" class="secondary">Save channel</button>
        </div>
        <div class="row">
          <div class="tz" role="group" aria-label="VOD type">
            <span class="tz-label">Type:</span>
            <button type="button" class="seg" data-vod-type="archive" aria-pressed="true">Past broadcasts</button>
            <button type="button" class="seg" data-vod-type="highlight" aria-pressed="false">Highlights</button>
            <button type="button" class="seg" data-vod-type="upload" aria-pressed="false">Uploads</button>
            <button type="button" class="seg" data-vod-type="all" aria-pressed="false">All</button>
          </div>
          <button type="button" id="browse-show">Show VODs</button>
          <button type="button" id="browse-hide" class="link" hidden>Hide list</button>
        </div>
        <p id="browse-message" class="message" role="status"></p>
        <ul id="browse-list" class="vod-list" hidden></ul>
        <div class="row">
          <button type="button" id="browse-more" class="secondary" hidden>Load more</button>
        </div>
      </div>

      <form id="add-form" novalidate>
        <div class="row">
          <label class="grow">VOD URL or ID
            <input id="vod" name="vod" required placeholder="https://www.twitch.tv/videos/123456789" autocomplete="off">
          </label>
          <button type="button" id="get-info" class="secondary">Get Info</button>
        </div>

        <div id="vod-info" class="vod-info" hidden>
          <img id="vod-thumb" alt="" width="160" height="90">
          <div>
            <div id="vod-title" class="vod-title"></div>
            <div id="vod-meta" class="muted"></div>
          </div>
        </div>

        <div class="grid">
          <label class="span-2">Title
            <input id="title" name="title" maxlength="500" placeholder="Leave blank to use the Twitch title">
          </label>
          <label>Quality
            <select id="quality" name="quality">
              <option value="">Best available</option>
            </select>
          </label>
          <label>Trim mode
            <select id="trim-mode" name="trimMode">
              <option value="Exact">Exact</option>
              <option value="Safe">Safe</option>
            </select>
          </label>
          <label>Start
            <input id="start" name="startTime" placeholder="0:00:00" autocomplete="off">
          </label>
          <label>End
            <input id="end" name="endTime" placeholder="End of VOD" autocomplete="off">
          </label>
        </div>

        <p id="rule-preview" class="muted" aria-live="polite"></p>
        <div class="row">
          <button type="submit" id="add-button">Add to library</button>
          <span id="add-message" class="message" role="status"></span>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="library-heading">
      <h2 id="library-heading">Library</h2>

      <!-- Hidden until the Calendar button opens it; sits above the search and filters -->
      <div id="calendar" class="calendar" aria-labelledby="cal-title" hidden>
        <div class="cal-head">
          <div class="cal-nav">
            <button type="button" class="link cal-arrow" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
            <h3 id="cal-title" aria-live="polite"></h3>
            <button type="button" class="link cal-arrow" id="cal-next" aria-label="Next month">&rsaquo;</button>          </div>
          <div class="tz" role="group" aria-label="Calendar is based on">
            <span class="tz-label">Calendar by:</span>
            <button type="button" class="seg" data-cal-field="streamDate" aria-pressed="true">Stream date</button>
            <button type="button" class="seg" data-cal-field="dateAdded" aria-pressed="false">Date added</button>
          </div>
        </div>
        <p id="cal-zone" class="muted cal-zone"></p>
        <div id="cal-grid" class="cal-grid"></div>
        <p id="cal-note" class="muted"></p>
      </div>

      <div class="controls">
        <input id="search" type="search" placeholder="Search titles" aria-label="Search titles">
        <!-- Shown while a day filter is active and the calendar is closed -->
        <button type="button" id="day-chip" class="chip" hidden></button>
        <select id="sort" aria-label="Sort by">
          <option value="dateAdded">Date added</option>
          <option value="streamDate">Stream date</option>
        </select>
        <select id="order" aria-label="Order">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <button type="button" id="recent-toggle" class="secondary" aria-pressed="false">Last 24h</button>
        <button type="button" id="cal-toggle" class="secondary" aria-expanded="false" aria-controls="calendar">Calendar</button>
      </div>

      <div id="day-filter" class="day-filter" hidden>
        <span id="day-filter-text"></span>
        <button type="button" class="link" id="day-filter-clear">Clear</button>
      </div>

      <p id="library-message" class="message" role="status"></p>
      <ul id="entries" class="entries"></ul>
      <p id="empty" class="muted" hidden>No entries yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
